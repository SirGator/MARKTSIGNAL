[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marktsignal-core"
version = "0.1.0"
description = "Context-aware economic impact scoring from unstructured information"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
marktsignal = "src.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]