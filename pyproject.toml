[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marktsignal-training"
version = "0.1.0"
description = "Offline training pipeline for the MARKTSIGNAL economic-impact model"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
marktsignal-train = "training.cli:main"
marktsignal-dataset = "dataset.generate:main"

[tool.setuptools.packages.find]
include = ["training*", "dataset*"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_checkpoint_cli.py",
    "tests/test_dataset.py",
    "tests/test_input_contract.py",
    "tests/test_model.py",
    "tests/test_serialization_parity.py",
    "tests/test_training.py",
    "tests/test_training_hardening.py",
    "tests/test_training_optimizations.py",
    "tests/test_training_resume.py",
    "tests/test_training_summary_mode.py",
]
pythonpath = ["."]
